[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightbot-mcp"
version = "0.1.0"
description = "MCP server for Nightbot: chat commands, timers, regulars, and spam-protection filters (including the banned-phrase blacklist) via the official Nightbot API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "aaronckj" }]
keywords = ["mcp", "nightbot", "chatbot", "streaming", "moderation", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nightbot-mcp = "nightbot_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/aaronckj/nightbot-mcp"
Issues = "https://github.com/aaronckj/nightbot-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nightbot_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
